name: Build and Release light_rumor APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Set Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Locate and Stage APK
        run: |
          mkdir -p dist
          # Search for release APK first, or debug APK as fallback
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          fi
          
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" dist/light_rumor.apk
            echo "Successfully staged APK from $APK_FILE to dist/light_rumor.apk"
            ls -lh dist/light_rumor.apk
          else
            echo "Error: No APK file found in build outputs!"
            find app/build/outputs/ -type f || true
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: light_rumor-apk
          path: dist/light_rumor.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          fi

          echo "Publishing release for tag: $TAG"
          gh release create "$TAG" dist/light_rumor.apk \
            --title "light_rumor Release $TAG" \
            --notes "## 📱 light_rumor Android APK

          スマートフォンから直接ダウンロードしてインストールできます：

          👉 **[light_rumor APKをダウンロードしてインストール](https://github.com/minetan1229/light_rumor/releases/download/$TAG/light_rumor.apk)**

          ### 主な特徴
          - Adobe Lightroom Classic / Capture One / DaVinci Resolve の強みを凝縮
          - 完全手動・32bitリニアRAW現像エンジン（Vulkan / C++20）
          - シネマ級RGB波形モニター（色の波）、フォルスカラー、ゼブラ、フォーカスピーキング
          - 9種の手動マスク、コピースタンプ、XMPプリセット、アナログリール履歴
          - テザー撮影、フォーカススタッキング、星景追尾スタック、ICCソフトプルーフ
          - 完全オフライン（インターネット通信権限なし）" \
            --latest \
            --clobber || gh release upload "$TAG" dist/light_rumor.apk --clobber
