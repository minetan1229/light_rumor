name: Build and Release light_rumor APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Set Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace
          ./gradlew assembleRelease --stacktrace || true

      - name: Locate and Stage APK
        run: |
          mkdir -p dist
          shopt -s globstar nullglob
          apks=(**/build/outputs/apk/**/*.apk)
          if [ ${#apks[@]} -gt 0 ]; then
            echo "Found APK: ${apks[0]}"
            cp "${apks[0]}" dist/light_rumor.apk
            ls -lh dist/light_rumor.apk
          else
            echo "Searching all .apk files in workspace..."
            all_apks=(**/*.apk)
            if [ ${#all_apks[@]} -gt 0 ]; then
              echo "Found APK: ${all_apks[0]}"
              cp "${all_apks[0]}" dist/light_rumor.apk
              ls -lh dist/light_rumor.apk
            else
              echo "Error: No APK file found!"
              exit 1
            fi
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: light_rumor-apk
          path: dist/light_rumor.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          fi

          echo "Publishing release for tag: $TAG"
          gh release create "$TAG" dist/light_rumor.apk \
            --title "light_rumor Release $TAG" \
            --notes "## 📱 light_rumor Android APK

          スマートフォンから直接ダウンロードしてインストールできます：

          👉 **[light_rumor APKをダウンロードしてインストール](https://github.com/minetan1229/light_rumor/releases/download/$TAG/light_rumor.apk)**

          ### 主な特徴
          - Adobe Lightroom Classic / Capture One / DaVinci Resolve の強みを凝縮
          - 完全手動・32bitリニアRAW現像エンジン（Vulkan / C++20）
          - シネマ級RGB波形モニター（色の波）、フォルスカラー、ゼブラ、フォーカスピーキング
          - 9種の手動マスク、コピースタンプ、XMPプリセット、アナログリール履歴
          - テザー撮影、フォーカススタッキング、星景追尾スタック、ICCソフトプルーフ
          - 完全オフライン（インターネット通信権限なし）" \
            --latest \
            --clobber || gh release upload "$TAG" dist/light_rumor.apk --clobber
