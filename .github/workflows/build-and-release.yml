name: Build and Release light_rumor APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK and NDK 27.0.12077973
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
        continue-on-error: true

      - name: Verify APK and Capture Error Log if Failed
        run: |
          shopt -s globstar nullglob
          apks=(**/build/outputs/apk/**/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "Build failed to generate APK. Uploading error log to ci-log branch..."
            git checkout -B ci-log
            cp build_log.txt build_error.txt
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add build_error.txt
            git commit -m "ci: capture build error log"
            git push -f origin ci-log
            exit 1
          fi

      - name: Locate and Stage APK
        run: |
          mkdir -p dist
          shopt -s globstar nullglob
          apks=(**/build/outputs/apk/**/*.apk)
          if [ ${#apks[@]} -gt 0 ]; then
            echo "Found APK: ${apks[0]}"
            cp "${apks[0]}" dist/light_rumor.apk
            ls -lh dist/light_rumor.apk
          else
            echo "Error: No APK file found!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: light_rumor-apk
          path: dist/light_rumor.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          fi

          echo "Publishing release for tag: $TAG"

          cat << 'EOF' > release_notes.md
## 📱 light_rumor Android APK

スマートフォンから直接ダウンロードしてインストールできます：

👉 **[light_rumor APKをダウンロードしてインストール](https://github.com/minetan1229/light_rumor/releases/latest/download/light_rumor.apk)**

### 主な特徴
- Adobe Lightroom Classic / Capture One / DaVinci Resolve の強みを凝縮
- 完全手動・32bitリニアRAW現像エンジン（Vulkan / C++20）
- シネマ級RGB波形モニター（色の波）、フォルスカラー、ゼブラ、フォーカスピーキング
- 9種の手動マスク、コピースタンプ、XMPプリセット、アナログリール履歴
- テザー撮影、フォーカススタッキング、星景追尾スタック、ICCソフトプルーフ
- 完全オフライン（インターネット通信権限なし）
EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading APK..."
            gh release upload "$TAG" dist/light_rumor.apk --clobber
          else
            echo "Creating release $TAG with APK..."
            gh release create "$TAG" dist/light_rumor.apk \
              --title "light_rumor Release $TAG" \
              --notes-file release_notes.md \
              --latest
          fi
